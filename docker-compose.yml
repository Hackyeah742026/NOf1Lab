services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5154:8080"
    volumes:
      - nof1lab-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/nof1lab.db
      DISABLE_HTTPS_REDIRECTION: "true"
      # Pass through from host/.env when present; empty = offline AI fallback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Safe local-demo default; override via Jwt__Key in root .env for anything shared
      Jwt__Key: ${Jwt__Key:-DEV_ONLY_CHANGE_ME_NOf1Lab_Super_Secret_Key_123!}
      Jwt__Issuer: NOf1Lab
      Jwt__Audience: NOf1Lab
      Cors__Origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5154
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nof1lab-data:
